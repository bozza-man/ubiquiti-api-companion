openapi: 3.1.0
info:
  title: UniFi Protect API
  version: 4.21.0
  description: >
    API specification for UniFi Protect.

    This API allows management of UniFi Protect devices, events, and
    configuration.
  contact:
    name: Ubiquiti API Companion
    url: https://github.com/yourusername/ubiquiti-api-companion
servers:
  - url: https://{nvr}:{port}
    description: UniFi Protect NVR
    variables:
      nvr:
        default: protect.local
        description: Hostname or IP of the UniFi Protect NVR
      port:
        default: '443'
        description: Port number of the UniFi Protect NVR
paths:
  /api/auth/login:
    post:
      summary: Log in to the UniFi Protect NVR
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Username for the UniFi Protect NVR
                password:
                  type: string
                  description: Password for the UniFi Protect NVR
                remember:
                  type: boolean
                  description: Whether to remember the login
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Authentication token
        '400':
          description: Bad request
        '401':
          description: Unauthorized
  /api/auth/logout:
    post:
      summary: Log out from the UniFi Protect NVR
      operationId: logout
      tags:
        - Authentication
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized
  /proxy/protect/api/bootstrap:
    get:
      summary: Get bootstrap data
      description: >
        This endpoint returns all the data needed to initialize the UniFi
        Protect interface.

        It includes information about cameras, events, users, and system
        settings.
      operationId: getBootstrap
      tags:
        - Bootstrap
      responses:
        '200':
          description: Bootstrap data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
        '401':
          description: Unauthorized
  /proxy/protect/api/cameras/{id}/snapshot:
    get:
      summary: Get camera snapshot
      description: Get a snapshot image from a camera
      operationId: getCameraSnapshot
      tags:
        - Cameras
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Camera ID
      responses:
        '200':
          description: Camera snapshot
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
        '404':
          description: Camera not found
  /proxy/protect/api/events:
    get:
      summary: Get events
      description: Get events from the UniFi Protect system
      operationId: getEvents
      tags:
        - Events
      parameters:
        - name: start
          in: query
          schema:
            type: integer
            format: int64
          description: Start time in milliseconds since epoch
        - name: end
          in: query
          schema:
            type: integer
            format: int64
          description: End time in milliseconds since epoch
        - name: type
          in: query
          schema:
            type: string
            enum:
              - motion
              - ring
              - smartDetectZone
          description: Event type
        - name: limit
          in: query
          schema:
            type: integer
          description: Maximum number of events to return
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          description: Unauthorized
components:
  schemas:
    Bootstrap:
      type: object
      properties:
        cameras:
          type: array
          items:
            $ref: '#/components/schemas/Camera'
        nvr:
          $ref: '#/components/schemas/NVR'
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        liveviews:
          type: array
          items:
            $ref: '#/components/schemas/LiveView'
        lastUpdateId:
          type: string
          description: ID of the last update
    Camera:
      type: object
      properties:
        id:
          type: string
          description: Camera ID
        name:
          type: string
          description: Camera name
        type:
          type: string
          enum:
            - UVC
            - UBV
            - MICRO
            - FLEX
            - G3
            - G3_DOME
            - G3_MICRO
            - G3_FLEX
            - G3_INSTANT
            - G4_DOORBELL
            - G4_PRO
            - G4_BULLET
          description: Camera type
        mac:
          type: string
          description: MAC address
        ip:
          type: string
          description: IP address
        host:
          type: string
          description: Hostname
        connectionHost:
          type: string
          description: Connection hostname
        state:
          type: string
          enum:
            - CONNECTED
            - DISCONNECTED
            - PENDING_ADOPTION
          description: Camera state
        hardwareRevision:
          type: string
          description: Hardware revision
        firmwareVersion:
          type: string
          description: Firmware version
        isAdopted:
          type: boolean
          description: Whether the camera is adopted
        isManaged:
          type: boolean
          description: Whether the camera is managed
        isAdoptedByOther:
          type: boolean
          description: Whether the camera is adopted by another system
        isProvisioned:
          type: boolean
          description: Whether the camera is provisioned
        isRebooting:
          type: boolean
          description: Whether the camera is rebooting
        isUpdating:
          type: boolean
          description: Whether the camera is updating
        lastSeen:
          type: integer
          format: int64
          description: Last seen timestamp
        lastMotion:
          type: integer
          format: int64
          description: Last motion timestamp
        lastRing:
          type: integer
          format: int64
          description: Last doorbell ring timestamp
        micVolume:
          type: integer
          description: Microphone volume
        speakerVolume:
          type: integer
          description: Speaker volume
        isRecording:
          type: boolean
          description: Whether the camera is recording
        isMotionDetectionEnabled:
          type: boolean
          description: Whether motion detection is enabled
        isPirEnabled:
          type: boolean
          description: Whether PIR (Passive Infrared) is enabled
        recordingSettings:
          $ref: '#/components/schemas/RecordingSettings'
        ledSettings:
          $ref: '#/components/schemas/LEDSettings'
        lcdsSettings:
          $ref: '#/components/schemas/LCDSettings'
        speakerSettings:
          $ref: '#/components/schemas/SpeakerSettings'
        osdSettings:
          $ref: '#/components/schemas/OSDSettings'
        talkbackSettings:
          $ref: '#/components/schemas/TalkbackSettings'
        smartDetectSettings:
          $ref: '#/components/schemas/SmartDetectSettings'
        stats:
          $ref: '#/components/schemas/CameraStats'
    NVR:
      type: object
      properties:
        id:
          type: string
          description: NVR ID
        name:
          type: string
          description: NVR name
        mac:
          type: string
          description: MAC address
        host:
          type: string
          description: Hostname
        version:
          type: string
          description: Software version
        firmwareVersion:
          type: string
          description: Firmware version
        hardwareRevision:
          type: string
          description: Hardware revision
        hardwarePlatform:
          type: string
          description: Hardware platform
        timeFormat:
          type: string
          enum:
            - 12h
            - 24h
          description: Time format
        timezone:
          type: string
          description: Timezone
        isAdopted:
          type: boolean
          description: Whether the NVR is adopted
        isManaged:
          type: boolean
          description: Whether the NVR is managed
        isSetup:
          type: boolean
          description: Whether the NVR is set up
        isUpdating:
          type: boolean
          description: Whether the NVR is updating
        isConfigured:
          type: boolean
          description: Whether the NVR is configured
        enableAutomaticBackups:
          type: boolean
          description: Whether automatic backups are enabled
        enableStatsReporting:
          type: boolean
          description: Whether stats reporting is enabled
        recordingRetentionDurationMs:
          type: integer
          format: int64
          description: Recording retention duration in milliseconds
        availableUpdates:
          type: array
          items:
            $ref: '#/components/schemas/Update'
        lastUpdateCheck:
          type: integer
          format: int64
          description: Last update check timestamp
        ports:
          $ref: '#/components/schemas/Ports'
        upSince:
          type: integer
          format: int64
          description: Up since timestamp
        lastSeen:
          type: integer
          format: int64
          description: Last seen timestamp
        isConnectedToCloud:
          type: boolean
          description: Whether the NVR is connected to the cloud
        isStation:
          type: boolean
          description: Whether the NVR is a station
        hosts:
          type: array
          items:
            type: string
          description: Hosts
        enableAutomaticUpdates:
          type: boolean
          description: Whether automatic updates are enabled
        disableAutoLink:
          type: boolean
          description: Whether auto link is disabled
        storage:
          $ref: '#/components/schemas/Storage'
        analyticsData:
          $ref: '#/components/schemas/AnalyticsData'
        wifiSettings:
          $ref: '#/components/schemas/WiFiSettings'
    User:
      type: object
      properties:
        id:
          type: string
          description: User ID
        firstName:
          type: string
          description: First name
        lastName:
          type: string
          description: Last name
        email:
          type: string
          description: Email address
        enableNotifications:
          type: boolean
          description: Whether notifications are enabled
        settings:
          type: object
          description: User settings
        permissions:
          type: array
          items:
            type: string
          description: User permissions
        role:
          type: string
          enum:
            - admin
            - user
            - view
            - restricted
          description: User role
        lastLoginIp:
          type: string
          description: Last login IP
        lastLoginTime:
          type: integer
          format: int64
          description: Last login timestamp
    Group:
      type: object
      properties:
        id:
          type: string
          description: Group ID
        name:
          type: string
          description: Group name
        members:
          type: array
          items:
            type: string
          description: Group member IDs
        permissions:
          type: array
          items:
            type: string
          description: Group permissions
    LiveView:
      type: object
      properties:
        id:
          type: string
          description: Live view ID
        name:
          type: string
          description: Live view name
        slots:
          type: array
          items:
            $ref: '#/components/schemas/LiveViewSlot'
        owner:
          type: string
          description: Owner ID
        isDefault:
          type: boolean
          description: Whether this is the default live view
        isGlobal:
          type: boolean
          description: Whether this is a global live view
    LiveViewSlot:
      type: object
      properties:
        cameraId:
          type: string
          description: Camera ID
        cycleMode:
          type: string
          enum:
            - null
            - all
          description: Cycle mode
        cycleInterval:
          type: integer
          description: Cycle interval in seconds
    Event:
      type: object
      properties:
        id:
          type: string
          description: Event ID
        type:
          type: string
          enum:
            - motion
            - ring
            - smartDetectZone
          description: Event type
        camera:
          type: string
          description: Camera ID
        start:
          type: integer
          format: int64
          description: Start timestamp
        end:
          type: integer
          format: int64
          description: End timestamp
        score:
          type: integer
          description: Score
        thumbnail:
          type: string
          description: Thumbnail URL
        heatmap:
          type: string
          description: Heatmap URL
        smartDetectTypes:
          type: array
          items:
            type: string
            enum:
              - person
              - vehicle
              - package
          description: Smart detect types
        smartDetectEvents:
          type: array
          items:
            type: string
          description: Smart detect event IDs
    RecordingSettings:
      type: object
      properties:
        fullTimeRecordEnabled:
          type: boolean
          description: Whether full-time recording is enabled
        prePaddingSecs:
          type: integer
          description: Pre-padding seconds
        postPaddingSecs:
          type: integer
          description: Post-padding seconds
        minMotionEventTrigger:
          type: integer
          description: Minimum motion event trigger
        enablePirTimelapse:
          type: boolean
          description: Whether PIR timelapse is enabled
        useNewMotionAlgorithm:
          type: boolean
          description: Whether to use the new motion algorithm
    LEDSettings:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: Whether LED is enabled
        blinkRate:
          type: integer
          description: Blink rate
    LCDSettings:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: Whether LCD is enabled
        text:
          type: string
          description: LCD text
    SpeakerSettings:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: Whether speaker is enabled
        volume:
          type: integer
          description: Speaker volume
    OSDSettings:
      type: object
      properties:
        isNameEnabled:
          type: boolean
          description: Whether name OSD is enabled
        isDateEnabled:
          type: boolean
          description: Whether date OSD is enabled
        isLogoEnabled:
          type: boolean
          description: Whether logo OSD is enabled
        isDebugEnabled:
          type: boolean
          description: Whether debug OSD is enabled
    TalkbackSettings:
      type: object
      properties:
        typeFmt:
          type: integer
          description: Type format
        typeIn:
          type: integer
          description: Type in
        bindAddr:
          type: string
          description: Bind address
        bindPort:
          type: integer
          description: Bind port
        filterAddr:
          type: string
          description: Filter address
        filterPort:
          type: integer
          description: Filter port
        channels:
          type: integer
          description: Channels
        samplingRate:
          type: integer
          description: Sampling rate
        bitsPerSample:
          type: integer
          description: Bits per sample
        quality:
          type: integer
          description: Quality
    SmartDetectSettings:
      type: object
      properties:
        isEnabled:
          type: boolean
          description: Whether smart detect is enabled
        objectTypes:
          type: array
          items:
            type: string
            enum:
              - person
              - vehicle
              - package
          description: Object types
    CameraStats:
      type: object
      properties:
        rxBytes:
          type: integer
          format: int64
          description: Received bytes
        txBytes:
          type: integer
          format: int64
          description: Transmitted bytes
        wifi:
          $ref: '#/components/schemas/WiFiStats'
        video:
          $ref: '#/components/schemas/VideoStats'
        storage:
          $ref: '#/components/schemas/StorageStats'
        firmware:
          $ref: '#/components/schemas/FirmwareStats'
    WiFiStats:
      type: object
      properties:
        rssi:
          type: integer
          description: RSSI (Received Signal Strength Indicator)
        signalQuality:
          type: integer
          description: Signal quality
        linkRate:
          type: integer
          description: Link rate
        channel:
          type: integer
          description: Channel
        frequency:
          type: integer
          description: Frequency
    VideoStats:
      type: object
      properties:
        recordingStartTime:
          type: integer
          format: int64
          description: Recording start time
        recordingEndTime:
          type: integer
          format: int64
          description: Recording end time
        totalRecordingTime:
          type: integer
          format: int64
          description: Total recording time
        motionRecordingTime:
          type: integer
          format: int64
          description: Motion recording time
    StorageStats:
      type: object
      properties:
        used:
          type: integer
          format: int64
          description: Used storage
        rate:
          type: integer
          format: int64
          description: Storage rate
    FirmwareStats:
      type: object
      properties:
        lastBetaVersion:
          type: string
          description: Last beta version
        lastStableVersion:
          type: string
          description: Last stable version
        lastFirmwareUpdateStatus:
          type: string
          description: Last firmware update status
    Update:
      type: object
      properties:
        version:
          type: string
          description: Version
        releaseDate:
          type: integer
          format: int64
          description: Release date
        releaseChannel:
          type: string
          enum:
            - release
            - beta
          description: Release channel
        updateType:
          type: string
          enum:
            - firmware
            - os
          description: Update type
        summary:
          type: string
          description: Summary
        notes:
          type: string
          description: Notes
        firmwareUrls:
          type: array
          items:
            type: string
          description: Firmware URLs
    Ports:
      type: object
      properties:
        httpPort:
          type: integer
          description: HTTP port
        httpsPort:
          type: integer
          description: HTTPS port
        rtspPort:
          type: integer
          description: RTSP port
        rtmpsPort:
          type: integer
          description: RTMPS port
    Storage:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/StorageDevice'
        availableDisks:
          type: array
          items:
            $ref: '#/components/schemas/AvailableDisk'
        availableRaids:
          type: array
          items:
            $ref: '#/components/schemas/AvailableRaid'
    StorageDevice:
      type: object
      properties:
        id:
          type: string
          description: Storage device ID
        name:
          type: string
          description: Storage device name
        type:
          type: string
          enum:
            - hdd
            - ssd
          description: Storage device type
        size:
          type: integer
          format: int64
          description: Storage device size
        used:
          type: integer
          format: int64
          description: Storage device used space
        status:
          type: string
          enum:
            - normal
            - warning
            - error
          description: Storage device status
        isMain:
          type: boolean
          description: Whether this is the main storage device
    AvailableDisk:
      type: object
      properties:
        id:
          type: string
          description: Available disk ID
        name:
          type: string
          description: Available disk name
        size:
          type: integer
          format: int64
          description: Available disk size
        model:
          type: string
          description: Available disk model
    AvailableRaid:
      type: object
      properties:
        id:
          type: string
          description: Available RAID ID
        name:
          type: string
          description: Available RAID name
        type:
          type: string
          enum:
            - raid0
            - raid1
            - raid5
            - raid10
          description: Available RAID type
        disks:
          type: array
          items:
            type: string
          description: Available RAID disk IDs
    AnalyticsData:
      type: object
      properties:
        resolution:
          type: string
          description: Resolution
        fps:
          type: integer
          description: Frames per second
        minObjectSize:
          type: integer
          description: Minimum object size
        motionHeatmap:
          type: boolean
          description: Whether motion heatmap is enabled
        thumbnails:
          type: boolean
          description: Whether thumbnails are enabled
    WiFiSettings:
      type: object
      properties:
        ssid:
          type: string
          description: SSID
        password:
          type: string
          description: Password
        useThirdPartyAP:
          type: boolean
          description: Whether to use a third-party AP
