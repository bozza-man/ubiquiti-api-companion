name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Lint
      run: npm run lint
    
    - name: Test
      run: npm test
    
    - name: Update specs
      run: npm run update-specs
    
    - name: Generate clients
      run: npm run generate-clients

  # Weekly job to update specs and regenerate clients
  update-specs:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Update specs
      run: npm run update-specs
    
    - name: Generate clients
      run: npm run generate-clients
    
    - name: Check for changes
      id: git-check
      run: |
        git status
        git diff --exit-code -- src/specs || echo "changes=true" >> $GITHUB_OUTPUT
    
    - name: Commit changes
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add src/specs src/generated
        git commit -m "Update API specs [automated]"
    
    - name: Create Pull Request
      if: steps.git-check.outputs.changes == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: Update API specs [automated]
        title: 'Update API specs [automated]'
        body: |
          This PR updates the OpenAPI specifications and regenerates client code.
          
          Changes were detected during the weekly automated update.
        branch: automated-spec-update
        base: ${{ github.ref }}